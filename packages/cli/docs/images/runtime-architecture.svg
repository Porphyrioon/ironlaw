<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">IronLaw 运行时架构</title>
  <desc id="desc">用户继续使用原有工作台。具备 hooks 的智能体编程框架经适配器接入 sidecar；不具备 hooks 的框架使用可复制 Prompt。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.2 L 10 5 L 0 8.8 z" fill="#1E3A5F"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.2 L 10 5 L 0 8.8 z" fill="#A8A29E"/>
    </marker>
    <filter id="lift" x="-3%" y="-5%" width="106%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#1C1917" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F5F0"/>
      <stop offset="1" stop-color="#EFEBE3"/>
    </linearGradient>
  </defs>

  <rect width="960" height="560" rx="20" fill="url(#bg)"/>
  <rect x="20" y="20" width="920" height="520" rx="16" fill="#FFFcf7" stroke="#E7E2D8"/>

  <text x="48" y="54" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12" letter-spacing="2.2" fill="#9A6B2F">RUNTIME · FRAMEWORK ADAPTERS</text>
  <text x="48" y="84" font-family="ui-sans-serif, system-ui, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="650" fill="#1C1917">运行时</text>
  <text x="48" y="110" font-family="ui-sans-serif, system-ui, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#57534E">一套协议、一个 sidecar、每套智能体编程框架一块适配器。</text>

  <!-- User -->
  <g filter="url(#lift)" font-family="ui-sans-serif, system-ui, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="48" y="140" width="160" height="88" rx="12" fill="#FFFcf7" stroke="#E7E2D8"/>
    <text x="128" y="176" text-anchor="middle" font-size="13" fill="#78716C">使用者</text>
    <text x="128" y="202" text-anchor="middle" font-size="16" font-weight="650" fill="#1C1917">原有工作台</text>
  </g>

  <line x1="208" y1="184" x2="248" y2="184" stroke="#1E3A5F" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Hosts -->
  <g filter="url(#lift)" font-family="ui-sans-serif, system-ui, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="248" y="132" width="248" height="168" rx="12" fill="#FFFcf7" stroke="#E7E2D8"/>
    <text x="268" y="158" font-size="11" letter-spacing="1.4" fill="#9A6B2F">FRAMEWORK</text>
    <text x="268" y="184" font-size="16" font-weight="650" fill="#1C1917">智能体编程框架</text>
    <text x="268" y="210" font-size="12" fill="#57534E">Claude · Grok · Zcode</text>
    <text x="268" y="230" font-size="12" fill="#57534E">Codex · Qoder · …</text>
    <text x="268" y="262" font-size="12" fill="#78716C">GUI / TUI / CLI 共用扩展点</text>
    <text x="268" y="282" font-size="12" fill="#A8A29E">可验证 hooks</text>
  </g>

  <line x1="496" y1="216" x2="536" y2="216" stroke="#1E3A5F" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Adapter -->
  <g filter="url(#lift)" font-family="ui-sans-serif, system-ui, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="536" y="148" width="168" height="136" rx="12" fill="#1E3A5F"/>
    <text x="556" y="176" font-size="11" letter-spacing="1.4" fill="#C4B08A">ADAPTER</text>
    <text x="556" y="204" font-size="16" font-weight="650" fill="#FFFcf7">薄适配器</text>
    <text x="556" y="230" font-size="12" fill="#E8E4DC">翻译事件</text>
    <text x="556" y="250" font-size="12" fill="#E8E4DC">映射 allow / block</text>
  </g>

  <line x1="704" y1="216" x2="744" y2="216" stroke="#1E3A5F" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Sidecar -->
  <g filter="url(#lift)" font-family="ui-sans-serif, system-ui, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="744" y="140" width="172" height="168" rx="12" fill="#FFFcf7" stroke="#1E3A5F" stroke-width="1.4"/>
    <text x="764" y="166" font-size="11" letter-spacing="1.4" fill="#9A6B2F">KERNEL</text>
    <text x="764" y="192" font-size="16" font-weight="650" fill="#1C1917">sidecar</text>
    <text x="764" y="220" font-size="12" fill="#57534E">任务状态机</text>
    <text x="764" y="240" font-size="12" fill="#57534E">证据账本</text>
    <text x="764" y="260" font-size="12" fill="#57534E">完成闸门</text>
    <text x="764" y="280" font-size="12" fill="#A8A29E">stdio NDJSON</text>
  </g>

  <!-- No hooks lane -->
  <line x1="128" y1="228" x2="128" y2="360" stroke="#A8A29E" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="128" y1="360" x2="268" y2="360" stroke="#A8A29E" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrowMuted)"/>

  <g filter="url(#lift)" font-family="ui-sans-serif, system-ui, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="268" y="328" width="416" height="88" rx="12" fill="#F5EDE1" stroke="#E4D4B8"/>
    <text x="288" y="356" font-size="11" letter-spacing="1.4" fill="#7C5A28">WITHOUT HOOKS</text>
    <text x="288" y="382" font-size="15" font-weight="650" fill="#1C1917">自行粘贴 Prompt</text>
    <text x="288" y="404" font-size="13" fill="#57534E">输出 MCP 最小工具集提示，由用户交给当前 Agent</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="708" y="328" width="208" height="88" rx="12" fill="#FFFcf7" stroke="#E7E2D8"/>
    <text x="728" y="356" font-size="11" letter-spacing="1.4" fill="#9A6B2F">DATA</text>
    <text x="728" y="382" font-size="15" font-weight="650" fill="#1C1917">本机账本</text>
    <text x="728" y="404" font-size="12" fill="#78716C">脱敏后落盘 · 不上传</text>
  </g>

  <text x="48" y="456" font-family="ui-sans-serif, system-ui, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#57534E">安装器先探测框架能力，再写入对应适配器。默认只观察、只记录；强制模式需显式打开。</text>
  <text x="48" y="480" font-family="ui-sans-serif, system-ui, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#57534E">MCP 默认关闭，以免治理 schema 进入模型上下文。</text>
  <text x="48" y="512" font-family="ui-sans-serif, system-ui, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#A8A29E">智能体编程框架自身的进程调度不在本图范围。</text>
</svg>
